name: Release

on:
  # this only exists just to test the workflow
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  get-tag-name:
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{steps.get-tag-name.outputs.tag-name}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get tag name
        id: get-tag-name
        shell: bash
        run: |
          # get the latest available tag if workflow dispatch
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME=TEST

          # triggered by actual tag push
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          echo "tag-name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "using tag: $TAG_NAME, with commit hash: $GITHUB_SHA"

      - name: Check commit in main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor $GITHUB_SHA "origin/main"; then
            echo "ERROR: Release tag must point to a commit on main."
            exit 1
          fi

  build:
    needs: get-tag-name
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            build: bash scripts/build-linux.sh

          - os: macos-latest
            build: bash scripts/build-macos.sh
            name: macos

          - os: windows-latest
            name: windows
            build: pwsh scripts/build-windows.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{github.sha}}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python using UV
        run: uv python install

      - name: Get dependencies
        run: uv sync --locked

      # this needs to exist so AppImage can be executed
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Build ${{ matrix.name }}
        run: |
          ${{ matrix.build }}

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [build, get-tag-name]
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      # only for debuggin
      - name: Show release files
        shell: bash
        run: |
          find dist -name "*.app.zip" -print
          find dist -name "*.AppImage" -print
          find dist -name "*.exe" -print

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: WORDEE ${{ needs.get-tag-name.outputs.tag-name }}
          tag_name: ${{ needs.get-tag-name.outputs.tag-name }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/WORDEE-windows-x86_64.zip
            dist/WORDEE-linux-x86_64.AppImage
            dist/WORDEE-macos-arm64.app.zip
