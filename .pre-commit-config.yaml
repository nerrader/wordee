repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        types_or: [python, pyproject]
        args: [--fix]
      - id: ruff-format
        types_or: [python]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.1
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

      - id: generate-resource-file
        name: generate-resource-file
        entry: uv run pyside6-rcc src/wordee/assets/resources.qrc -o src/wordee/assets/resources_rc.py
        language: system
        pass_filenames: false

      - id: validate-commit-message
        name: validate-commit-message
        entry: uv run ./scripts/hooks/check_commit_message.py
        language: system
        stages: [commit-msg]
