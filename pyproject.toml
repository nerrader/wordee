[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wordee/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wordee"]

[tool.pyright]
exclude = [".**/*", "**/__pycache__/**", "./src/wordle_gui/assets/**"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.mypy]
strict = true
exclude = "^src/wordee/assets/"

[tool.ruff.lint]
ignore = ["DTZ011"]

[project]
name = "wordee"
dynamic = ["version"]
description = "This is my own version of Wordle in a custom GUI desktop application format."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "platformdirs>=4.10.0",
  "pyside6>=6.11.1",
]

[project.scripts]
wordle = "wordee.main:main"

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=4.6.1",
  "pytest>=9.0.3",
  "respx>=0.23.1",
  "ruff>=0.15.17",
]
